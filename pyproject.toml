# =============================================================================
# BLOCK 1: METADATA BLOCK
# =============================================================================
# Module: pyproject.toml
# Architecture: Declarative Python Packaging Specification (PEP 517 / 518 / 621)
# Domain: Platform Packaging, Dependency Manifest & Tool Configuration
# Description: Modern declarative configuration defining build requirements,
#              runtime dependencies, console script entry points, and Pytest
#              test suite runner options.
#
# Invariants:
#   - Synchronized with setup.py and requirements.txt dependencies.
#   - Excludes non-source build and test directories from wheel distributions.
# =============================================================================

# =============================================================================
# BLOCK 2: OPENING BLOCK (Build System Specification)
# =============================================================================
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

# =============================================================================
# BLOCK 3: BODY BLOCK (Core Project Specification & Dependencies)
# =============================================================================

# -----------------------------------------------------------------------------
# SUB-BLOCK 3.1: Project Identity & Classifiers
# -----------------------------------------------------------------------------
[project]
name = "yugioh-server"
version = "1.0.0"
description = "Yu-Gi-Oh! Custom Card, Story & Live Duel Simulator Platform"
readme = "README.md"
authors = [
    { name = "professorseanex" }
]
requires-python = ">=3.9"
keywords = [
    "yugioh",
    "simulator",
    "discord-bot",
    "fastapi",
    "duelingbook",
    "edopro",
    "ocgcore",
    "lore",
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Topic :: Games/Entertainment :: Board Games",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

# -----------------------------------------------------------------------------
# SUB-BLOCK 3.2: Runtime Dependencies
# -----------------------------------------------------------------------------
dependencies = [
    "fastapi>=0.115.0",      # Interactive card catalog and REST API server
    "uvicorn>=0.30.0",       # Production ASGI web server engine
    "pydantic>=2.8.0",       # Data validation models for card lore and decks
    "python-dotenv>=1.0.0",   # Automated environment variable resolution
    "httpx>=0.27.0",         # Async HTTP client for test suite and API requests
    "requests>=2.31.0",      # HTTP library for client card sync downloads
    "discord.py>=2.3.0",     # Modular Discord bot runner and slash command framework
    "aiosqlite>=0.20.0",     # Asynchronous SQLite driver for non-blocking bot queries
    "pillow>=10.0.0",        # Image processing library for card thumbnails
]

# -----------------------------------------------------------------------------
# SUB-BLOCK 3.3: Optional & Development Dependencies
# -----------------------------------------------------------------------------
[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

# -----------------------------------------------------------------------------
# SUB-BLOCK 3.4: Project URLs & Repository Links
# -----------------------------------------------------------------------------
[project.urls]
"Homepage" = "https://thelandofkustomazi.com"
"Repository" = "https://github.com/Novaking34/yugioh-server-and-bot-application"
"Bug Tracker" = "https://github.com/Novaking34/yugioh-server-and-bot-application/issues"
"Documentation" = "https://github.com/Novaking34/yugioh-server-and-bot-application/blob/master/README.md"

# =============================================================================
# BLOCK 4: CLOSING BLOCK (Entry Points, Tooling Configuration & Test Options)
# =============================================================================

# -----------------------------------------------------------------------------
# SUB-BLOCK 4.1: Console Scripts & Tooling Discovery
# -----------------------------------------------------------------------------
[project.scripts]
ygo-manage = "manage:main"

[tool.setuptools]
py-modules = ["manage"]
packages = [
    "config",
    "development",
    "production",
    "packages",
    "data",
]

# -----------------------------------------------------------------------------
# SUB-BLOCK 4.2: Pytest Test Suite Configuration
# -----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["development/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore:.*Using `httpx` with `starlette.testclient` is deprecated.*:DeprecationWarning",
    "ignore:.*Using `httpx` with `starlette.testclient` is deprecated.*:UserWarning",
]
