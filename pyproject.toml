[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yugioh-server"
version = "1.0.0"
description = "Yu-Gi-Oh! Custom Card, Story & Live Duel Simulator Platform"
readme = "README.md"
authors = [
    { name = "professorseanex" }
]
requires-python = ">=3.9"
keywords = ["yugioh", "simulator", "discord-bot", "fastapi", "duelingbook", "edopro"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Games/Entertainment :: Board Games",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "discord.py>=2.3.0",
    "aiosqlite>=0.20.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
ygo-manage = "manage:main"

[tool.setuptools]
py-modules = ["manage"]
packages = ["config", "development", "production", "packages"]
